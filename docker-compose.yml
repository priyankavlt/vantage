# Local development.
#   pnpm db:up                       -> Postgres + sample warehouse (run the apps with `pnpm dev`)
#   docker compose --profile app up  -> Postgres + web + server in containers
name: vantage

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vantage
      POSTGRES_PASSWORD: vantage
      POSTGRES_DB: vantage
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vantage -d vantage']
      interval: 5s
      timeout: 3s
      retries: 10

  # Sample database to try Vantage with. Connect with:
  #   host localhost (or "warehouse" from the server container), port 5434,
  #   database shop, user vantage_reader, password reader
  warehouse:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop_admin
      POSTGRES_PASSWORD: shop_admin
      POSTGRES_DB: shop
    ports:
      - '5434:5432'
    volumes:
      - warehouse-data:/var/lib/postgresql
      - ./docker/sample-warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  server:
    profiles: [app]
    build:
      context: .
      target: server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://vantage:vantage@postgres:5432/vantage
      SERVER_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      # Local only. Set a real secret (openssl rand -base64 32) for any shared deployment.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-secret-change-me-0123456789}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      target: web
      args:
        API_URL: http://server:4000
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      - server

volumes:
  postgres-data:
  warehouse-data:
